# XcodeGen spec. Regenerate the project after editing: `xcodegen generate`
name: iScreenBarMenu
options:
  bundleIdPrefix: org.windholm
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "27.2"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Ad-hoc ("Sign to Run Locally") at project level; the app target uses Config/Signing.xcconfig.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    DEAD_CODE_STRIPPING: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
targets:
  iScreenBar Menu:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      # Everything in iScreenBarMenu/ is added to the target (e.g. AppIcon.icon dropped in later).
      - path: iScreenBarMenu
        excludes:
          - Info.plist
          - iScreenBarMenu.sdef
      # Copy the scripting dictionary as a resource (a .sdef in Sources would run sdp instead).
      - path: iScreenBarMenu/iScreenBarMenu.sdef
        buildPhase: resources
      # Control Center action names and intents, shared with the extension.
      - path: Shared
    dependencies:
      - target: iScreenBar Menu Controls
    settings:
      base:
        PRODUCT_NAME: iScreenBar Menu
        EXECUTABLE_NAME: iScreenBarMenu
        PRODUCT_BUNDLE_IDENTIFIER: org.windholm.iScreenBarMenu
        MARKETING_VERSION: "0.5"
        CURRENT_PROJECT_VERSION: 39
        INFOPLIST_FILE: iScreenBarMenu/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        # Signing lives in Config/Signing.xcconfig (ad-hoc), optionally overridden by
        # the git-ignored Config/Signing.local.xcconfig. Don't set signing keys here:
        # target settings would override the xcconfig.
        ENABLE_APP_SANDBOX: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  # Control Center controls (macOS 26+). Embedded in the app's PlugIns folder.
  iScreenBar Menu Controls:
    type: app-extension
    platform: macOS
    deploymentTarget: "26.0"
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: iScreenBarMenuControls
        excludes:
          - Info.plist
          - iScreenBarMenuControls.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: iScreenBarMenuControls
        PRODUCT_BUNDLE_IDENTIFIER: org.windholm.iScreenBarMenu.Controls
        MARKETING_VERSION: "0.5"
        CURRENT_PROJECT_VERSION: 39
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        INFOPLIST_FILE: iScreenBarMenuControls/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: iScreenBarMenuControls/iScreenBarMenuControls.entitlements
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
schemes:
  iScreenBar Menu:
    build:
      targets:
        iScreenBar Menu: all
    run:
      config: Debug
    archive:
      config: Release
