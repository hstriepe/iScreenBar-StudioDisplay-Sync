# XcodeGen spec. Regenerate the project after editing: `xcodegen generate`
name: iScreenMenu
options:
  bundleIdPrefix: org.windholm
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "27.2"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Ad-hoc ("Sign to Run Locally") for the whole project; no team or profile needed.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    DEAD_CODE_STRIPPING: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
targets:
  iScreen Menu:
    type: application
    platform: macOS
    sources:
      # Everything in iScreenMenu/ is added to the target (e.g. AppIcon.icon dropped in later).
      - path: iScreenMenu
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_NAME: iScreen Menu
        EXECUTABLE_NAME: iScreenMenu
        PRODUCT_BUNDLE_IDENTIFIER: org.windholm.iScreenMenu
        MARKETING_VERSION: 0.2.0
        CURRENT_PROJECT_VERSION: 2
        INFOPLIST_FILE: iScreenMenu/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
schemes:
  iScreen Menu:
    build:
      targets:
        iScreen Menu: all
    run:
      config: Debug
    archive:
      config: Release
