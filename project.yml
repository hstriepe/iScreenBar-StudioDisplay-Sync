# XcodeGen spec. Regenerate the project after editing: `xcodegen generate`
name: iScreenMenu
options:
  bundleIdPrefix: local.qiu
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  iScreen Menu:
    type: application
    platform: macOS
    sources:
      # Everything in iScreenMenu/ is added to the target (e.g. AppIcon.icon dropped in later).
      - path: iScreenMenu
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_NAME: iScreen Menu
        EXECUTABLE_NAME: iScreenBarStudioSync
        PRODUCT_BUNDLE_IDENTIFIER: local.qiu.iScreenBarStudioSync
        INFOPLIST_FILE: iScreenMenu/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
schemes:
  iScreen Menu:
    build:
      targets:
        iScreen Menu: all
    run:
      config: Debug
    archive:
      config: Release
